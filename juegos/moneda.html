<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cara o Cruz — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/juegos.css">
<style></style>
</head>
<body>
  <div class="contenedor">
    <div class="juego-wrap">
      <a href="../index.html" class="volver">← Volver al lobby</a>
      <div class="juego-top">
        <div class="marca">🪙 Cara o Cruz</div>
        <div class="derecha"><div class="saldo-pill"><span aria-hidden="true">🪙</span><span id="saldo">···</span></div></div>
      </div>

      <section class="mesa">
        <p class="mesa-titulo">Elegí un lado y tirá</p>
        <div class="moneda-escena"><div class="moneda" id="moneda">
          <div class="lado cara"><b>S</b><small>CARA</small></div><div class="lado cruz"><b>★</b><small>CRUZ</small></div></div></div>
        <div class="resultado" id="resultado"></div>
      </section>

      <div class="opciones" id="opciones">
        <button type="button" class="opcion" data-v="cara">Cara</button>
        <button type="button" class="opcion" data-v="cruz">Cruz</button>
      </div>

      <div id="rack"></div>
      <button class="btn-jugar" id="btn-jugar">Tirar moneda</button>
      <div id="mensaje" role="status" style="position:absolute;left:-9999px"></div>

      <details class="reglas">
        <summary>Cómo se paga</summary>
        <table class="tabla-premios"><tr><td>Acertás</td><td>×1,9</td></tr></table><p style="color:var(--text-dim);font-size:.82rem;margin:0 0 10px">Con 10.000 apostadas, acertando cobrás 19.000.</p>
      </details>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/juegos.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let giros = 0;
    const moneda = document.getElementById("moneda");
    const op = crearOpciones(document.getElementById("opciones"));
    Mesa.iniciar({ juego: "moneda", inicial: 1000 });
    document.getElementById("btn-jugar").onclick = (e) => {
      if (!op.valor) { Mesa.ctrl.aviso("Elegí cara o cruz"); return; }
      Mesa.ronda(e.currentTarget, async (apuesta) => {
        op.bloquear(true);
        try {
          const data = await jugarMoneda(apuesta, op.valor);
          giros++;
          const sale = data.resultado.resultado;
          const grados = giros * 1800 + (sale === "cruz" ? 180 : 0);
          moneda.style.transition = Efectos.reducido ? "none" : "";
          moneda.style.transform = `rotateY(${grados}deg)`;
          Sonido.tocar("tick");
          await Efectos.esperar(Efectos.reducido ? 0 : 2000);
          Mesa.resultado({ apuesta, ganancia: data.ganancia, detalle: `Salió ${sale}` });
          Mesa.setSaldo(data.saldo_nuevo);
        } finally { op.bloquear(false); }
      });
    };
  </script>
</body>
</html>
