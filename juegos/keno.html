<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keno — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/juegos.css">
<style></style>
</head>
<body>
  <div class="contenedor">
    <div class="juego-wrap">
      <a href="../index.html" class="volver">← Volver al lobby</a>
      <div class="juego-top">
        <div class="marca">🔢 Keno</div>
        <div class="derecha"><div class="saldo-pill"><span aria-hidden="true">🪙</span><span id="saldo">···</span></div></div>
      </div>

      <section class="mesa">
        <p class="mesa-titulo">Elegí un número del 1 al 40: se sortean 10</p>
        <div class="keno-grilla" id="grilla"></div>
        <div class="keno-info" id="info">Tocá tu número de la suerte</div>
        <div class="resultado" id="resultado"></div>
      </section>


      <div id="rack"></div>
      <button class="btn-jugar" id="btn-jugar">Sortear</button>
      <div id="mensaje" role="status" style="position:absolute;left:-9999px"></div>

      <details class="reglas">
        <summary>Cómo se paga</summary>
        <table class="tabla-premios"><tr><td>Tu número está entre los 10 sorteados</td><td>×3,8</td></tr></table><p style="color:var(--text-dim);font-size:.82rem;margin:0 0 10px">Con 5.000 apostadas, si sale tu número cobrás 19.000.</p>
      </details>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/juegos.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let mio = null;
    const grilla = document.getElementById("grilla"), info = document.getElementById("info");
    for (let i = 1; i <= 40; i++) { const b = document.createElement("button"); b.type = "button"; b.textContent = i; b.dataset.n = i; grilla.appendChild(b); }
    grilla.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b || Mesa.ocupado) return;
      grilla.querySelectorAll(".mio").forEach((x) => x.classList.remove("mio", "bola", "acierto"));
      grilla.querySelectorAll(".bola").forEach((x) => x.classList.remove("bola", "acierto"));
      mio = Number(b.dataset.n); b.classList.add("mio"); Sonido.tocar("ficha"); info.textContent = `Tu número: ${mio}`;
    });
    Mesa.iniciar({ juego: "keno", inicial: 1000 });
    document.getElementById("btn-jugar").onclick = (e) => {
      if (!mio) { Mesa.ctrl.aviso("Elegí un número del 1 al 40"); return; }
      Mesa.ronda(e.currentTarget, async (apuesta) => {
        grilla.querySelectorAll("button").forEach((x) => x.classList.remove("bola", "acierto"));
        const data = await jugarKeno(apuesta, mio);
        let acerto = false;
        for (const n of data.resultado.sorteados) {
          const b = grilla.children[n - 1]; b.classList.add("bola");
          if (n === mio) { b.classList.add("acierto"); acerto = true; }
          Sonido.tocar("tick"); info.textContent = `Salió el ${n}`;
          await Efectos.esperar(Efectos.reducido ? 0 : 330);
        }
        info.textContent = acerto ? `¡Tu ${mio} salió!` : `Tu ${mio} no salió`;
        Mesa.resultado({ apuesta, ganancia: data.ganancia });
        Mesa.setSaldo(data.saldo_nuevo);
      });
    };
  </script>
</body>
</html>
