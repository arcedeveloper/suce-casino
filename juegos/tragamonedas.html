<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tragamonedas — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/juegos.css">
<style>
  .tragamonedas { padding-top: 30px; }
  .ventana {
    display: flex; justify-content: center; gap: 10px; padding: 12px; border-radius: 18px;
    background: #03100f; border: 1px solid var(--riel);
    box-shadow: inset 0 6px 22px rgba(0,0,0,.85), 0 0 0 4px rgba(7,26,31,.9), 0 0 30px rgba(45,212,191,.12);
    position: relative;
  }
  .ventana::after { /* línea de pago */
    content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; transform: translateY(-50%);
    background: linear-gradient(90deg, transparent, rgba(94,234,212,.7), transparent); pointer-events: none; z-index: 2;
  }
  .carrete {
    --alto: 92px; width: 96px; height: calc(var(--alto) * 3); overflow: hidden; position: relative; border-radius: 12px;
    background: linear-gradient(180deg, #0c1f24, #112b30 50%, #0c1f24); border: 1px solid rgba(255,255,255,.08);
  }
  .carrete::before, .carrete::after { content: ""; position: absolute; left: 0; right: 0; height: 40%; z-index: 1; pointer-events: none; }
  .carrete::before { top: 0; background: linear-gradient(180deg, rgba(3,16,15,.92), transparent); }
  .carrete::after { bottom: 0; background: linear-gradient(0deg, rgba(3,16,15,.92), transparent); }
  .cinta { display: flex; flex-direction: column; will-change: transform; }
  .simbolo { height: var(--alto); flex: 0 0 var(--alto); display: flex; align-items: center; justify-content: center; font-size: 2.9rem; }
  .carrete.gira .cinta { filter: blur(2.5px); }
  .carrete.premio { box-shadow: 0 0 0 2px var(--neon-suave), 0 0 26px rgba(45,212,191,.55); }
  .luces { display: flex; justify-content: center; gap: 9px; margin-top: 14px; }
  .luz { width: 7px; height: 7px; border-radius: 50%; background: rgba(94,234,212,.18); transition: all .15s; }
  .luz.on { background: var(--neon-suave); box-shadow: 0 0 9px 2px rgba(94,234,212,.7); }
  @media (max-width: 520px) { .carrete { --alto: 76px; width: 78px; } .simbolo { font-size: 2.35rem; } }
</style>
</head>
<body>
  <div class="contenedor">
    <div class="juego-wrap">
      <a href="../index.html" class="volver">← Volver al lobby</a>
      <div class="juego-top">
        <div class="marca">🎰 Tragamonedas</div>
        <div class="derecha"><div class="saldo-pill"><span aria-hidden="true">🪙</span><span id="saldo">···</span></div></div>
      </div>

      <section class="mesa tragamonedas">
        <p class="mesa-titulo">Tres iguales en la línea y cobrás</p>
        <div class="ventana" id="ventana"></div>
        <div class="luces" id="luces"><i class="luz"></i><i class="luz"></i><i class="luz"></i><i class="luz"></i><i class="luz"></i><i class="luz"></i><i class="luz"></i></div>
        <div class="resultado" id="resultado"></div>
      </section>

      <div id="rack"></div>
      <button class="btn-jugar" id="btn-jugar">Girar</button>
      <div class="mensaje" id="mensaje" role="status" style="position:absolute;left:-9999px"></div>

      <details class="reglas">
        <summary>Cómo se paga</summary>
        <table class="tabla-premios">
          <tr><td>7️⃣ 7️⃣ 7️⃣</td><td>×10</td></tr>
          <tr><td>⭐ ⭐ ⭐</td><td>×6</td></tr>
          <tr><td>Otros tres iguales</td><td>×3</td></tr>
          <tr><td>Dos iguales</td><td>Recuperás la apuesta</td></tr>
        </table>
        <p style="color:var(--text-dim);font-size:.82rem;margin:0 0 10px">Con 5.000 apostadas, tres sietes pagan 50.000.</p>
      </details>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/juegos.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    const SIMBOLOS = ['🍒','🍋','🔔','⭐','7️⃣'];
    const rnd = () => SIMBOLOS[Math.floor(Math.random() * SIMBOLOS.length)];
    const ventana = document.getElementById("ventana");
    const luces = [...document.querySelectorAll(".luz")];
    const ALTO = () => parseFloat(getComputedStyle(ventana.querySelector(".carrete")).getPropertyValue("--alto"));

    // Cada carrete es una cinta vertical: [azar × N][resultado] y se desliza hasta el final.
    const carretes = [0, 1, 2].map(() => {
      const c = document.createElement("div"); c.className = "carrete";
      const cinta = document.createElement("div"); cinta.className = "cinta";
      c.appendChild(cinta); ventana.appendChild(c);
      cinta.innerHTML = [rnd(), rnd(), rnd()].map(s => `<div class="simbolo">${s}</div>`).join("");
      return { c, cinta, centro: cinta.children[1].textContent };
    });

    function girar(r, final, vueltas, ms) {
      const alto = ALTO(), previos = [r.cinta.children[0].textContent, r.centro, r.cinta.children[2].textContent];
      const sec = [...previos]; for (let i = 0; i < vueltas; i++) sec.push(rnd());
      sec.push(rnd(), final, rnd());                    // el del medio (línea de pago) es el resultado
      r.cinta.style.transition = "none"; r.cinta.style.transform = "translateY(0)";
      r.cinta.innerHTML = sec.map(s => `<div class="simbolo">${s}</div>`).join("");
      void r.cinta.offsetWidth;
      r.c.classList.add("gira");
      const destino = -(sec.length - 3) * alto;
      r.cinta.style.transition = Efectos.reducido ? "none" : `transform ${ms}ms cubic-bezier(.12,.7,.2,1.04)`;
      r.cinta.style.transform = `translateY(${destino}px)`;
      r.centro = final;
      return Efectos.esperar(Efectos.reducido ? 0 : ms).then(() => r.c.classList.remove("gira"));
    }

    function chispear() {
      let i = 0; const t = setInterval(() => { luces.forEach((l, k) => l.classList.toggle("on", (k + i) % 2 === 0)); i++; }, 130);
      return () => { clearInterval(t); luces.forEach(l => l.classList.remove("on")); };
    }

    Mesa.iniciar({ juego: "tragamonedas", inicial: 1000 });

    document.getElementById("btn-jugar").onclick = (e) => Mesa.ronda(e.currentTarget, async (apuesta) => {
      carretes.forEach(r => r.c.classList.remove("premio"));
      const apagar = chispear();
      try {
        const data = await jugarTragamonedas(apuesta);
        const f = data.resultado.carretes;
        const base = 1500;
        const parar = Sonido.giro(base + 2 * 600, 46, "motor");
        await Promise.all(carretes.map((r, i) => {
          const p = girar(r, f[i], 10 + i * 5, base + i * 600);
          p.then(() => Sonido.tocar("stop"));
          return p;
        }));
        parar();
        if (data.ganancia > 0 && f[0] === f[1] && f[1] === f[2]) carretes.forEach(r => r.c.classList.add("premio"));
        Mesa.resultado({ apuesta, ganancia: data.ganancia });
        Mesa.setSaldo(data.saldo_nuevo);
      } finally { apagar(); }
    });
  </script>
</body>
</html>
