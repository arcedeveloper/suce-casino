<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cara o Cruz — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .moneda-visual {
    width: 120px; height: 120px; margin: 10px auto 20px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.2rem;
    background: radial-gradient(circle at 35% 30%, #f4d778, #a9791f);
    box-shadow: inset 0 -6px 14px rgba(0,0,0,0.3), 0 10px 24px rgba(0,0,0,0.4);
  }
  .moneda-visual.girando { animation: girar-moneda 0.9s ease-in-out; }
  @keyframes girar-moneda {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(1440deg); }
  }
  .opciones { display: flex; gap: 10px; margin-bottom: 14px; }
  .opciones button { flex: 1; }
  .opciones button.elegida { outline: 2px solid var(--gold-soft); }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">🪙 Cara o Cruz</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="moneda-visual" id="moneda">🪙</div>

      <div class="opciones">
        <button class="secundario" id="btn-cara" onclick="elegir('cara')">Cara</button>
        <button class="secundario" id="btn-cruz" onclick="elegir('cruz')">Cruz</button>
      </div>

      <div class="apuesta-controles" style="display:flex; gap:10px; align-items:center; margin-bottom:14px; justify-content:center;">
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(-10)">−</button>
        <div style="flex:1; text-align:center; font-weight:700; font-size:1.2rem; color:var(--gold-soft);">🪙 <span id="valor-apuesta">50</span></div>
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar" disabled>Elegí cara o cruz</button>
      <div class="mensaje" id="mensaje"></div>
      <div class="sub" style="text-align:center;">Acertá y ganás x1.9 tu apuesta</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50, eleccion = null;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;

    function elegir(op) {
      eleccion = op;
      document.getElementById("btn-cara").classList.toggle("elegida", op === "cara");
      document.getElementById("btn-cruz").classList.toggle("elegida", op === "cruz");
      document.getElementById("btn-jugar").disabled = false;
      document.getElementById("btn-jugar").textContent = "Tirar moneda";
    }

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      document.getElementById("saldo").textContent = await obtenerMiSaldo();
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      const moneda = document.getElementById("moneda");
      btn.disabled = true;
      mensaje.textContent = "";
      moneda.classList.add("girando");

      try {
        const promesa = jugarMoneda(apuesta, eleccion);
        await new Promise(r => setTimeout(r, 900));
        const data = await promesa;

        moneda.classList.remove("girando");
        moneda.textContent = data.resultado.resultado === "cara" ? "🪙" : "⚪";

        if (data.ganancia > 0) {
          mensaje.textContent = `¡Salió ${data.resultado.resultado}! Ganaste ${data.ganancia} fichas 🎉`;
          mensaje.className = "mensaje ganaste";
        } else {
          mensaje.textContent = `Salió ${data.resultado.resultado}. Sin suerte esta vez`;
          mensaje.className = "mensaje perdiste";
        }
        document.getElementById("saldo").textContent = data.saldo_nuevo;
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      } finally {
        btn.disabled = false;
      }
    }

    cargarSaldo();
  </script>
</body>
</html>
