<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta Más Alta — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .duelo { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 10px 0 20px; }
  .lado { text-align: center; }
  .lado .etiqueta { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 6px; }
  .carta-visual {
    width: 74px; height: 104px;
    background: linear-gradient(180deg, #f4f0e6, #e4ddc8);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; font-weight: 800; color: #1a1400;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  .vs { font-family: 'Playfair Display', serif; color: var(--gold-soft); font-weight: 900; font-size: 1.2rem; }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">♠️ Carta Más Alta</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="duelo">
        <div class="lado">
          <div class="etiqueta">Vos</div>
          <div class="carta-visual" id="carta-jugador">?</div>
        </div>
        <div class="vs">VS</div>
        <div class="lado">
          <div class="etiqueta">Casa</div>
          <div class="carta-visual" id="carta-casa">?</div>
        </div>
      </div>

      <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px; justify-content:center;">
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(-10)">−</button>
        <div style="flex:1; text-align:center; font-weight:700; font-size:1.2rem; color:var(--gold-soft);">🪙 <span id="valor-apuesta">50</span></div>
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar">Repartir cartas</button>
      <div class="mensaje" id="mensaje"></div>
      <div class="sub">Tu carta más alta gana x1.9 (empate = pierde)</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;
    const NOMBRES = {1:'A',11:'J',12:'Q',13:'K'};
    const nombreCarta = n => NOMBRES[n] || n;

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      document.getElementById("saldo").textContent = await obtenerMiSaldo();
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      btn.disabled = true;
      mensaje.textContent = "";

      try {
        const data = await jugarCartaAlta(apuesta);
        document.getElementById("carta-jugador").textContent = nombreCarta(data.resultado.carta_jugador);
        document.getElementById("carta-casa").textContent = nombreCarta(data.resultado.carta_casa);

        if (data.ganancia > 0) {
          mensaje.textContent = `¡Ganaste ${data.ganancia} fichas! 🎉`;
          mensaje.className = "mensaje ganaste";
        } else {
          mensaje.textContent = "La casa se quedó con la mano";
          mensaje.className = "mensaje perdiste";
        }
        document.getElementById("saldo").textContent = data.saldo_nuevo;
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      } finally {
        btn.disabled = false;
      }
    }

    cargarSaldo();
  </script>
</body>
</html>
