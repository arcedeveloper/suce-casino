<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rasca y Gana — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .tarjeta-rasca {
    background: linear-gradient(180deg, #1d2230, #0d1017);
    border-radius: 16px;
    padding: 28px 10px;
    border: 1px solid rgba(212,175,55,0.25);
    display: flex; justify-content: center; gap: 14px;
    margin-bottom: 18px;
  }
  .casilla {
    width: 72px; height: 72px;
    background: #10131a;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
    box-shadow: inset 0 3px 8px rgba(0,0,0,0.6);
  }
  .casilla.revelada { animation: pop 0.3s ease; }
  @keyframes pop { 0% { transform: scale(0.6); opacity: 0.3; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">🎫 Rasca y Gana</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="tarjeta-rasca">
        <div class="casilla" id="c1">🎫</div>
        <div class="casilla" id="c2">🎫</div>
        <div class="casilla" id="c3">🎫</div>
      </div>

      <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px; justify-content:center;">
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(-10)">−</button>
        <div style="flex:1; text-align:center; font-weight:700; font-size:1.2rem; color:var(--gold-soft);">🪙 <span id="valor-apuesta">50</span></div>
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar">Comprar y raspar</button>
      <div class="mensaje" id="mensaje"></div>
      <div class="sub">👑👑👑 x12 · 💎💎💎 x8 · otros ×3: x4 · 2 iguales: recuperás la apuesta</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      document.getElementById("saldo").textContent = await obtenerMiSaldo();
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      btn.disabled = true;
      mensaje.textContent = "";
      ["c1","c2","c3"].forEach(id => { document.getElementById(id).textContent = "🎫"; document.getElementById(id).classList.remove("revelada"); });

      try {
        const data = await jugarRasca(apuesta);
        const simbolos = data.resultado.simbolos;
        ["c1","c2","c3"].forEach((id, i) => {
          setTimeout(() => {
            const el = document.getElementById(id);
            el.textContent = simbolos[i];
            el.classList.add("revelada");
          }, i * 250);
        });

        setTimeout(() => {
          if (data.ganancia > 0) {
            mensaje.textContent = `¡Ganaste ${data.ganancia} fichas! 🎉`;
            mensaje.className = "mensaje ganaste";
          } else {
            mensaje.textContent = "Sin suerte esta vez";
            mensaje.className = "mensaje perdiste";
          }
          document.getElementById("saldo").textContent = data.saldo_nuevo;
          btn.disabled = false;
        }, 850);
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
        btn.disabled = false;
      }
    }

    cargarSaldo();
  </script>
</body>
</html>
