<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruleta — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .resultado-numero {
    width: 84px; height: 84px; margin: 10px auto 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 800; color: #fff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    background: #333;
    transition: background 0.2s ease;
  }
  .resultado-numero.rojo { background: linear-gradient(160deg, #e5484d, #9c2226); }
  .resultado-numero.negro { background: linear-gradient(160deg, #2a2f3d, #0d0f14); }
  .resultado-numero.verde { background: linear-gradient(160deg, #3ecf6e, #1c7a3e); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; }
  .tabs button.activo { outline: 2px solid var(--gold-soft); }
  .colores { display: flex; gap: 10px; margin-bottom: 14px; }
  .colores button { flex: 1; }
  .colores button.rojo-btn { background: linear-gradient(135deg, #e5484d, #9c2226); color: #fff; box-shadow:none; }
  .colores button.negro-btn { background: linear-gradient(135deg, #3a3f4d, #14161c); color: #fff; box-shadow:none; }
  .colores button.elegida { outline: 2px solid var(--gold-soft); }
  input#numero-elegido { text-align:center; font-size:1.3rem; font-weight:700; }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">🎡 Ruleta</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="resultado-numero" id="resultado-numero">?</div>

      <div class="tabs">
        <button class="secundario activo" id="tab-color" onclick="cambiarTab('color')">Color</button>
        <button class="secundario" id="tab-numero" onclick="cambiarTab('numero')">Número exacto</button>
      </div>

      <div id="panel-color">
        <div class="colores">
          <button class="rojo-btn" id="btn-rojo" onclick="elegirColor('rojo')">🔴 Rojo</button>
          <button class="negro-btn" id="btn-negro" onclick="elegirColor('negro')">⚫ Negro</button>
        </div>
        <div class="sub" style="margin-top:-8px;">Paga x1.9</div>
      </div>

      <div id="panel-numero" style="display:none;">
        <input type="number" id="numero-elegido" min="0" max="36" placeholder="0 a 36">
        <div class="sub" style="margin-top:-8px;">Número exacto paga x34</div>
      </div>

      <div style="display:flex; gap:10px; align-items:center; margin:16px 0 14px; justify-content:center;">
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(-10)">−</button>
        <div style="flex:1; text-align:center; font-weight:700; font-size:1.2rem; color:var(--gold-soft);">🪙 <span id="valor-apuesta">50</span></div>
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar">Girar ruleta</button>
      <div class="mensaje" id="mensaje"></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50, tab = "color", colorElegido = null;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;

    function cambiarTab(t) {
      tab = t;
      document.getElementById("tab-color").classList.toggle("activo", t === "color");
      document.getElementById("tab-numero").classList.toggle("activo", t === "numero");
      document.getElementById("panel-color").style.display = t === "color" ? "block" : "none";
      document.getElementById("panel-numero").style.display = t === "numero" ? "block" : "none";
    }

    function elegirColor(c) {
      colorElegido = c;
      document.getElementById("btn-rojo").classList.toggle("elegida", c === "rojo");
      document.getElementById("btn-negro").classList.toggle("elegida", c === "negro");
    }

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      document.getElementById("saldo").textContent = await obtenerMiSaldo();
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = "";

      let tipo, valor;
      if (tab === "color") {
        if (!colorElegido) { mensaje.textContent = "Elegí un color"; mensaje.className = "mensaje perdiste"; return; }
        tipo = "color"; valor = colorElegido;
      } else {
        const n = document.getElementById("numero-elegido").value;
        if (n === "" || n < 0 || n > 36) { mensaje.textContent = "Ingresá un número de 0 a 36"; mensaje.className = "mensaje perdiste"; return; }
        tipo = "numero"; valor = n;
      }

      btn.disabled = true;
      try {
        const data = await jugarRuleta(apuesta, tipo, valor);
        const numEl = document.getElementById("resultado-numero");
        numEl.className = "resultado-numero " + data.resultado.color;
        numEl.textContent = data.resultado.numero;

        if (data.ganancia > 0) {
          mensaje.textContent = `¡Salió ${data.resultado.numero} (${data.resultado.color})! Ganaste ${data.ganancia} fichas 🎉`;
          mensaje.className = "mensaje ganaste";
        } else {
          mensaje.textContent = `Salió ${data.resultado.numero} (${data.resultado.color}). Sin suerte`;
          mensaje.className = "mensaje perdiste";
        }
        document.getElementById("saldo").textContent = data.saldo_nuevo;
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      } finally {
        btn.disabled = false;
      }
    }

    cargarSaldo();
  </script>
</body>
</html>
