<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruleta — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/juegos.css">
<style></style>
</head>
<body>
  <div class="contenedor">
    <div class="juego-wrap">
      <a href="../index.html" class="volver">← Volver al lobby</a>
      <div class="juego-top">
        <div class="marca">🎡 Ruleta</div>
        <div class="derecha"><div class="saldo-pill"><span aria-hidden="true">🪙</span><span id="saldo">···</span></div></div>
      </div>

      <section class="mesa">
        <p class="mesa-titulo">Rojo, negro o tu número de la suerte</p>
        <div class="rueda-wrap"><div class="rueda-flecha"></div><svg viewBox="0 0 300 300" id="svg-ruleta" role="img" aria-label="Ruleta"><g class="rueda-gira" id="rul"></g></svg></div>
        <div class="numero-grande" id="num-grande"></div>
        <div class="resultado" id="resultado"></div>
      </section>

      <div class="opciones" id="modo" style="margin-bottom:10px">
        <button type="button" class="opcion sel" data-v="color">Color<span class="sub-op">paga ×1,9</span></button>
        <button type="button" class="opcion" data-v="numero">Número exacto<span class="sub-op">paga ×34</span></button>
      </div>
      <div id="panel-color" class="opciones" style="margin-bottom:14px">
        <button type="button" class="opcion" data-v="rojo" style="--c:#fb7185">🔴 Rojo</button>
        <button type="button" class="opcion" data-v="negro">⚫ Negro</button>
      </div>
      <div id="panel-numero" style="display:none;margin-bottom:14px">
        <input class="num-input" id="num-in" type="number" min="0" max="36" inputmode="numeric" placeholder="0 – 36" aria-label="Número de 0 a 36">
      </div>

      <div id="rack"></div>
      <button class="btn-jugar" id="btn-jugar">Girar ruleta</button>
      <div id="mensaje" role="status" style="position:absolute;left:-9999px"></div>

      <details class="reglas">
        <summary>Cómo se paga</summary>
        <table class="tabla-premios"><tr><td>Número exacto (0 a 36)</td><td>×34</td></tr><tr><td>Rojo o negro</td><td>×1,9</td></tr><tr><td>Sale 0 (verde)</td><td>Gana la casa en colores</td></tr></table><p style="color:var(--text-dim);font-size:.82rem;margin:0 0 10px">Con 1.000 al número, si sale cobrás 34.000.</p>
      </details>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/juegos.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    const ORDEN = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
    const ROJOS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
    const paso = 360 / 37, R = 146, r0 = 92, C = 150;
    const rad = (a) => (a - 90) * Math.PI / 180;
    const pt = (a, r) => [C + r * Math.cos(rad(a)), C + r * Math.sin(rad(a))];
    let svg = `<circle cx="150" cy="150" r="149" fill="#0b1a1f" stroke="rgba(94,234,212,.6)" stroke-width="2"/>`;
    ORDEN.forEach((n, i) => {
      const a0 = i * paso - paso / 2, a1 = i * paso + paso / 2;
      const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), [x2, y2] = pt(a1, r0), [x3, y3] = pt(a0, r0);
      const col = n === 0 ? "#15803d" : ROJOS.includes(n) ? "#be123c" : "#0f172a";
      const [tx, ty] = pt(i * paso, 121);
      svg += `<path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1} ${y1} L${x2} ${y2} A${r0} ${r0} 0 0 0 ${x3} ${y3} Z" fill="${col}" stroke="rgba(255,255,255,.35)" stroke-width=".6"/>`
           + `<text x="${tx}" y="${ty}" fill="#fff" font-size="9.5" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Poppins,sans-serif" transform="rotate(${i * paso} ${tx} ${ty})">${n}</text>`;
    });
    svg += `<circle cx="150" cy="150" r="88" fill="#071a1f" stroke="rgba(94,234,212,.5)" stroke-width="2"/><circle cx="150" cy="150" r="60" fill="url(#hub)"/><circle cx="150" cy="150" r="10" fill="#5eead4"/>`;
    const rul = document.getElementById("rul");
    rul.innerHTML = `<defs><radialGradient id="hub"><stop offset="0" stop-color="#134e4a"/><stop offset="1" stop-color="#042f2e"/></radialGradient></defs>` + svg;
    let vueltas = 0;
    const colorDe = (n) => n === 0 ? "verde" : ROJOS.includes(n) ? "rojo" : "negro";

    const modo = crearOpciones(document.getElementById("modo"), (v) => {
      document.getElementById("panel-color").style.display = v === "color" ? "flex" : "none";
      document.getElementById("panel-numero").style.display = v === "numero" ? "block" : "none";
    });
    const colores = crearOpciones(document.getElementById("panel-color"));
    const numIn = document.getElementById("num-in");
    const grande = document.getElementById("num-grande");
    const esModo = () => modo.valor || "color";

    Mesa.iniciar({ juego: "ruleta", inicial: 1000 });
    document.getElementById("btn-jugar").onclick = (e) => {
      let tipo = esModo(), valor;
      if (tipo === "color") { valor = colores.valor; if (!valor) { Mesa.ctrl.aviso("Elegí rojo o negro"); return; } }
      else { valor = numIn.value; if (valor === "" || +valor < 0 || +valor > 36 || !Number.isInteger(+valor)) { Mesa.ctrl.aviso("Ingresá un número entero de 0 a 36"); return; } }
      Mesa.ronda(e.currentTarget, async (apuesta) => {
        grande.textContent = ""; grande.className = "numero-grande";
        const data = await jugarRuleta(apuesta, tipo, valor);
        const n = data.resultado.numero, idx = ORDEN.indexOf(n);
        vueltas++;
        rul.style.transition = Efectos.reducido ? "none" : "";
        rul.style.transform = `rotate(${vueltas * 1800 - idx * paso}deg)`;
        const t = setInterval(() => Sonido.tocar("tick"), 220);
        await Efectos.esperar(Efectos.reducido ? 0 : 4700); clearInterval(t);
        grande.textContent = n; grande.className = "numero-grande " + (data.resultado.color || colorDe(n));
        await Efectos.esperar(300);
        Mesa.resultado({ apuesta, ganancia: data.ganancia, detalle: `Salió ${n} (${data.resultado.color})` });
        Mesa.setSaldo(data.saldo_nuevo);
      });
    };
  </script>
</body>
</html>
