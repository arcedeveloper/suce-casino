<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keno — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .grilla-keno {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
    margin-bottom: 18px;
  }
  .num-keno {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #10131a;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700;
    cursor: pointer;
  }
  .num-keno.elegido { background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #1a1400; }
  .num-keno.sorteado:not(.elegido) { outline: 2px solid var(--green); }
  .num-keno.acierto { outline: 3px solid var(--green); }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">🔢 Keno</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="panel">
      <div class="sub" style="text-align:center; margin-top:0;">Elegí 1 número del 1 al 40. Se sortean 10.</div>
      <div class="grilla-keno" id="grilla"></div>

      <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px; justify-content:center;">
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(-10)">−</button>
        <div style="flex:1; text-align:center; font-weight:700; font-size:1.2rem; color:var(--gold-soft);">🪙 <span id="valor-apuesta">50</span></div>
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar" disabled>Elegí un número</button>
      <div class="mensaje" id="mensaje"></div>
      <div class="sub" style="text-align:center;">Si tu número sale sorteado, ganás x3.8</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50, numeroElegido = null;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;

    function renderGrilla() {
      const grilla = document.getElementById("grilla");
      grilla.innerHTML = "";
      for (let i = 1; i <= 40; i++) {
        const div = document.createElement("div");
        div.className = "num-keno";
        div.textContent = i;
        div.onclick = () => elegirNumero(i);
        grilla.appendChild(div);
      }
    }

    function elegirNumero(n) {
      numeroElegido = n;
      document.querySelectorAll(".num-keno").forEach((el, i) => {
        el.classList.toggle("elegido", i + 1 === n);
        el.classList.remove("sorteado", "acierto");
      });
      document.getElementById("btn-jugar").disabled = false;
      document.getElementById("btn-jugar").textContent = "Sortear";
    }

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      document.getElementById("saldo").textContent = await obtenerMiSaldo();
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      btn.disabled = true;
      mensaje.textContent = "";

      try {
        const data = await jugarKeno(apuesta, numeroElegido);
        const sorteados = data.resultado.sorteados;
        document.querySelectorAll(".num-keno").forEach((el, i) => {
          const n = i + 1;
          if (sorteados.includes(n)) el.classList.add("sorteado");
          if (n === numeroElegido && sorteados.includes(n)) el.classList.add("acierto");
        });

        if (data.ganancia > 0) {
          mensaje.textContent = `¡Tu número salió sorteado! Ganaste ${data.ganancia} fichas 🎉`;
          mensaje.className = "mensaje ganaste";
        } else {
          mensaje.textContent = "Tu número no salió esta vez";
          mensaje.className = "mensaje perdiste";
        }
        document.getElementById("saldo").textContent = data.saldo_nuevo;
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      } finally {
        btn.disabled = false;
      }
    }

    renderGrilla();
    cargarSaldo();
  </script>
</body>
</html>
