<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dados — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .dados-visual { display: flex; justify-content: center; gap: 14px; margin: 10px 0 6px; }
  .dado {
    width: 64px; height: 64px;
    background: linear-gradient(180deg, #f4f0e6, #e4ddc8);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  .dado.rodando { animation: rodar 0.15s linear infinite; }
  @keyframes rodar { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  .suma { text-align:center; color: var(--text-dim); font-size: 0.85rem; margin-bottom: 16px; }
  .opciones { display: flex; gap: 10px; margin-bottom: 14px; }
  .opciones button { flex: 1; }
  .opciones button.elegida { outline: 2px solid var(--gold-soft); }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">🎲 Dados</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="dados-visual">
        <div class="dado" id="dado1">🎲</div>
        <div class="dado" id="dado2">🎲</div>
      </div>
      <div class="suma" id="suma">Suma: --</div>

      <div class="opciones">
        <button class="secundario" id="btn-bajo" onclick="elegir('bajo')">Bajo (2-6)</button>
        <button class="secundario" id="btn-alto" onclick="elegir('alto')">Alto (8-12)</button>
      </div>
      <div class="sub" style="margin-top:-8px;">Si sale 7, gana la casa</div>

      <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px; justify-content:center;">
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(-10)">−</button>
        <div style="flex:1; text-align:center; font-weight:700; font-size:1.2rem; color:var(--gold-soft);">🪙 <span id="valor-apuesta">50</span></div>
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar" disabled>Elegí alto o bajo</button>
      <div class="mensaje" id="mensaje"></div>
      <div class="sub">Acertá y ganás x2.2 tu apuesta</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50, eleccion = null;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;

    function elegir(op) {
      eleccion = op;
      document.getElementById("btn-alto").classList.toggle("elegida", op === "alto");
      document.getElementById("btn-bajo").classList.toggle("elegida", op === "bajo");
      document.getElementById("btn-jugar").disabled = false;
      document.getElementById("btn-jugar").textContent = "Tirar dados";
    }

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      document.getElementById("saldo").textContent = await obtenerMiSaldo();
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      const d1 = document.getElementById("dado1"), d2 = document.getElementById("dado2");
      btn.disabled = true;
      mensaje.textContent = "";
      d1.classList.add("rodando"); d2.classList.add("rodando");

      try {
        const promesa = jugarDados(apuesta, eleccion);
        await new Promise(r => setTimeout(r, 700));
        const data = await promesa;

        d1.classList.remove("rodando"); d2.classList.remove("rodando");
        const caras = ['','⚀','⚁','⚂','⚃','⚄','⚅'];
        d1.textContent = caras[data.resultado.dado1];
        d2.textContent = caras[data.resultado.dado2];
        document.getElementById("suma").textContent = `Suma: ${data.resultado.suma}`;

        if (data.ganancia > 0) {
          mensaje.textContent = `¡Ganaste ${data.ganancia} fichas! 🎉`;
          mensaje.className = "mensaje ganaste";
        } else if (data.resultado.suma === 7) {
          mensaje.textContent = "Salió 7 — gana la casa";
          mensaje.className = "mensaje perdiste";
        } else {
          mensaje.textContent = "Sin suerte esta vez";
          mensaje.className = "mensaje perdiste";
        }
        document.getElementById("saldo").textContent = data.saldo_nuevo;
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      } finally {
        btn.disabled = false;
      }
    }

    cargarSaldo();
  </script>
</body>
</html>
