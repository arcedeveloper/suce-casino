<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alto o Bajo — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .cartas { display: flex; justify-content: center; gap: 16px; margin: 10px 0 20px; }
  .carta-visual {
    width: 74px; height: 104px;
    background: linear-gradient(180deg, #f4f0e6, #e4ddc8);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; font-weight: 800; color: #1a1400;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
  }
  .carta-visual.dorso { background: linear-gradient(135deg, var(--gold-soft), var(--gold-deep)); font-size: 2rem; color: rgba(0,0,0,0.3); }
  .opciones { display: flex; gap: 10px; margin-bottom: 14px; }
  .opciones button { flex: 1; }
  .opciones button.elegida { outline: 2px solid var(--gold-soft); }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">⬆️ Alto o Bajo</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="cartas">
        <div class="carta-visual" id="carta-actual">?</div>
        <div class="carta-visual dorso" id="carta-nueva">🂠</div>
      </div>
      <div class="sub" style="margin-top:-10px;">¿La próxima carta es más alta o más baja?</div>

      <div class="opciones">
        <button class="secundario" id="btn-alto" onclick="elegir('alto')">⬆️ Alto</button>
        <button class="secundario" id="btn-bajo" onclick="elegir('bajo')">⬇️ Bajo</button>
      </div>

      <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px; justify-content:center;">
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(-10)">−</button>
        <div style="flex:1; text-align:center; font-weight:700; font-size:1.2rem; color:var(--gold-soft);">🪙 <span id="valor-apuesta">50</span></div>
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar" disabled>Elegí alto o bajo</button>
      <div class="mensaje" id="mensaje"></div>
      <div class="sub">Acertá y ganás x1.9 tu apuesta (empate = pierde)</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50, eleccion = null;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;
    const NOMBRES = {1:'A',11:'J',12:'Q',13:'K'};
    const nombreCarta = n => NOMBRES[n] || n;

    // Mostramos una carta inicial "de referencia" en pantalla (visual,
    // el valor real que cuenta lo calcula el servidor al jugar).
    document.getElementById("carta-actual").textContent = nombreCarta(1 + Math.floor(Math.random()*13));

    function elegir(op) {
      eleccion = op;
      document.getElementById("btn-alto").classList.toggle("elegida", op === "alto");
      document.getElementById("btn-bajo").classList.toggle("elegida", op === "bajo");
      document.getElementById("btn-jugar").disabled = false;
      document.getElementById("btn-jugar").textContent = "Revelar carta";
    }

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      document.getElementById("saldo").textContent = await obtenerMiSaldo();
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      btn.disabled = true;
      mensaje.textContent = "";

      try {
        const data = await jugarHilo(apuesta, eleccion);
        document.getElementById("carta-actual").textContent = nombreCarta(data.resultado.carta_actual);
        const nuevaEl = document.getElementById("carta-nueva");
        nuevaEl.classList.remove("dorso");
        nuevaEl.textContent = nombreCarta(data.resultado.carta_nueva);

        if (data.ganancia > 0) {
          mensaje.textContent = `¡Acertaste! Ganaste ${data.ganancia} fichas 🎉`;
          mensaje.className = "mensaje ganaste";
        } else {
          mensaje.textContent = "No acertaste esta vez";
          mensaje.className = "mensaje perdiste";
        }
        document.getElementById("saldo").textContent = data.saldo_nuevo;

        setTimeout(() => {
          nuevaEl.classList.add("dorso");
          nuevaEl.textContent = "🂠";
          document.getElementById("carta-actual").textContent = nombreCarta(data.resultado.carta_nueva);
        }, 1400);
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      } finally {
        btn.disabled = false;
      }
    }

    cargarSaldo();
  </script>
</body>
</html>
