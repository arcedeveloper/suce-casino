<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alto o Bajo — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/juegos.css">
<style></style>
</head>
<body>
  <div class="contenedor">
    <div class="juego-wrap">
      <a href="../index.html" class="volver">← Volver al lobby</a>
      <div class="juego-top">
        <div class="marca">⬆️ Alto o Bajo</div>
        <div class="derecha"><div class="saldo-pill"><span aria-hidden="true">🪙</span><span id="saldo">···</span></div></div>
      </div>

      <section class="mesa">
        <p class="mesa-titulo">¿La próxima carta es mayor o menor?</p>
        <div class="cartas">
          <div class="lado"><div id="c-act"></div><small>Carta actual</small></div>
          <div class="vs">→</div>
          <div class="lado"><div id="c-nue"></div><small>Siguiente</small></div>
        </div>
        <div class="resultado" id="resultado"></div>
      </section>

      <div class="opciones" id="opciones">
        <button type="button" class="opcion" data-v="bajo">Más baja<span class="sub-op">menor que la actual</span></button>
        <button type="button" class="opcion" data-v="alto">Más alta<span class="sub-op">mayor que la actual</span></button>
      </div>

      <div id="rack"></div>
      <button class="btn-jugar" id="btn-jugar">Revelar carta</button>
      <div id="mensaje" role="status" style="position:absolute;left:-9999px"></div>

      <details class="reglas">
        <summary>Cómo se paga</summary>
        <table class="tabla-premios"><tr><td>Acertás</td><td>×1,9</td></tr><tr><td>Misma carta</td><td>Pierde</td></tr></table><p style="color:var(--text-dim);font-size:.82rem;margin:0 0 10px">El orden va de A (la más baja) a K (la más alta).</p>
      </details>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/juegos.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    const act = document.getElementById("c-act"), nue = document.getElementById("c-nue");
    const abrir = (el, n) => { el.innerHTML = cartaHTML(n); void el.offsetWidth; el.firstElementChild.classList.add("abierta"); };
    act.innerHTML = cartaHTML(1 + Math.floor(Math.random() * 13)); act.firstElementChild.classList.add("abierta");
    nue.innerHTML = cartaHTML(0);
    const op = crearOpciones(document.getElementById("opciones"));
    Mesa.iniciar({ juego: "hilo", inicial: 1000 });
    document.getElementById("btn-jugar").onclick = (e) => {
      if (!op.valor) { Mesa.ctrl.aviso("Elegí más alta o más baja"); return; }
      Mesa.ronda(e.currentTarget, async (apuesta) => {
        op.bloquear(true);
        try {
          nue.innerHTML = cartaHTML(0);
          const data = await jugarHilo(apuesta, op.valor);
          act.innerHTML = cartaHTML(data.resultado.carta_actual); act.firstElementChild.classList.add("abierta");
          await Efectos.esperar(450);
          abrir(nue, data.resultado.carta_nueva); Sonido.tocar("tick");
          await Efectos.esperar(Efectos.reducido ? 0 : 900);
          if (data.ganancia > 0) nue.firstElementChild.classList.add("ganadora");
          Mesa.resultado({ apuesta, ganancia: data.ganancia });
          Mesa.setSaldo(data.saldo_nuevo);
        } finally { op.bloquear(false); }
      });
    };
  </script>
</body>
</html>
