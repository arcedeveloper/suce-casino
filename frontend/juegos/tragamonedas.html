<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tragamonedas — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .maquina {
    background: linear-gradient(180deg, #1d2230, #0d1017);
    border-radius: 20px;
    padding: 20px 16px 24px;
    border: 1px solid rgba(212,175,55,0.25);
    box-shadow: inset 0 2px 20px rgba(0,0,0,0.5), var(--shadow-gold);
    margin-bottom: 18px;
  }

  .carretes {
    display: flex;
    justify-content: center;
    gap: 10px;
    background: #05060a;
    border-radius: 12px;
    padding: 20px 10px;
    box-shadow: inset 0 4px 14px rgba(0,0,0,0.7);
  }

  .carrete {
    width: 72px;
    height: 84px;
    background: linear-gradient(180deg, #12141c, #090a0f);
    border-radius: 10px;
    border: 1px solid rgba(212,175,55,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    overflow: hidden;
    position: relative;
  }

  .carrete .simbolo {
    transition: transform 0.08s linear;
  }

  .carrete.girando .simbolo {
    animation: girar 0.12s linear infinite;
  }

  @keyframes girar {
    0%   { transform: translateY(0); filter: blur(1px); }
    100% { transform: translateY(84px); filter: blur(1px); }
  }

  .carrete.parado .simbolo {
    animation: asentar 0.35s cubic-bezier(.2,.9,.3,1.2);
  }

  @keyframes asentar {
    0%   { transform: translateY(-18px); opacity: 0.4; }
    100% { transform: translateY(0); opacity: 1; }
  }

  .palanca-luz {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 14px;
  }
  .luz {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(212,175,55,0.25);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .luz.activa {
    background: var(--gold-soft);
    box-shadow: 0 0 8px 2px rgba(244,215,120,0.7);
  }

  .apuesta-controles {
    display: flex;
    gap: 10px;
    align-items: center;
    margin: 18px 0 14px;
    justify-content: center;
  }
  .ficha-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 2px dashed rgba(212,175,55,0.5);
    background: radial-gradient(circle at 35% 30%, #2a2310, #171205);
    color: var(--gold-soft);
    font-weight: 700;
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .ficha-btn:active { transform: scale(0.92); }
  .valor-apuesta {
    flex: 1;
    text-align: center;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--gold-soft);
  }
  .valor-apuesta small {
    display: block;
    color: var(--text-dim);
    font-weight: 500;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .tabla-premios {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    margin-top: 14px;
    line-height: 1.6;
  }
  .tabla-premios b { color: var(--gold-soft); }

  .destello {
    animation: destellar 0.6s ease;
  }
  @keyframes destellar {
    0%, 100% { box-shadow: var(--shadow-gold); }
    50% { box-shadow: 0 0 0 1px rgba(62,207,110,0.6), 0 0 30px rgba(62,207,110,0.5); }
  }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">🎰 Tragamonedas</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="maquina" id="maquina">
      <div class="carretes" id="carretes">
        <div class="carrete"><span class="simbolo">❔</span></div>
        <div class="carrete"><span class="simbolo">❔</span></div>
        <div class="carrete"><span class="simbolo">❔</span></div>
      </div>
      <div class="palanca-luz">
        <span class="luz"></span><span class="luz"></span><span class="luz"></span>
        <span class="luz"></span><span class="luz"></span>
      </div>
    </div>

    <div class="panel">
      <div class="apuesta-controles">
        <button class="ficha-btn" onclick="cambiarApuesta(-10)">−</button>
        <div class="valor-apuesta">
          <small>Apuesta</small>
          🪙 <span id="valor-apuesta">50</span>
        </div>
        <button class="ficha-btn" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar">🎰 Girar</button>
      <div class="mensaje" id="mensaje"></div>

      <div class="tabla-premios">
        3 iguales: <b>x3</b> · 3 estrellas ⭐: <b>x6</b> · 3 sietes 7️⃣: <b>x10</b><br>
        2 iguales: recuperás tu apuesta
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;
    const SIMBOLOS = ['🍒','🍋','🔔','⭐','7️⃣'];

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      const saldo = await obtenerMiSaldo();
      document.getElementById("saldo").textContent = saldo;
    }

    function simboloAlAzar() {
      return SIMBOLOS[Math.floor(Math.random() * SIMBOLOS.length)];
    }

    // Animación de giro: mientras esperamos la respuesta del servidor,
    // los carretes muestran símbolos random para dar sensación de giro.
    function animarGiro(carreteEls, duracionMs) {
      return new Promise((resolve) => {
        carreteEls.forEach(c => c.classList.add("girando"));
        const intervalos = carreteEls.map(c =>
          setInterval(() => { c.querySelector(".simbolo").textContent = simboloAlAzar(); }, 60)
        );
        setTimeout(() => {
          intervalos.forEach(clearInterval);
          carreteEls.forEach(c => c.classList.remove("girando"));
          resolve();
        }, duracionMs);
      });
    }

    function encenderLuces() {
      const luces = document.querySelectorAll(".luz");
      let i = 0;
      const t = setInterval(() => {
        luces.forEach(l => l.classList.remove("activa"));
        luces[i % luces.length].classList.add("activa");
        i++;
      }, 90);
      return () => { clearInterval(t); luces.forEach(l => l.classList.remove("activa")); };
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      const maquina = document.getElementById("maquina");
      const carreteEls = Array.from(document.querySelectorAll(".carrete"));

      btn.disabled = true;
      mensaje.textContent = "";
      mensaje.className = "mensaje";
      maquina.classList.remove("destello");

      const apagarLuces = encenderLuces();

      try {
        // Pedimos el resultado real al servidor en paralelo a la animación,
        // así el giro visual y la respuesta llegan más o menos juntos.
        const promesaJuego = jugarTragamonedas(apuesta);
        await animarGiro(carreteEls, 900);
        const data = await promesaJuego;

        const [r1, r2, r3] = data.resultado.carretes;
        const valores = [r1, r2, r3];
        carreteEls.forEach((c, i) => {
          c.classList.add("parado");
          c.querySelector(".simbolo").textContent = valores[i];
          setTimeout(() => c.classList.remove("parado"), 400);
        });

        if (data.ganancia > 0) {
          mensaje.textContent = `¡Ganaste ${data.ganancia} fichas! 🎉`;
          mensaje.className = "mensaje ganaste";
          maquina.classList.add("destello");
        } else {
          mensaje.textContent = "Sin suerte esta vez";
          mensaje.className = "mensaje perdiste";
        }
        document.getElementById("saldo").textContent = data.saldo_nuevo;
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      } finally {
        apagarLuces();
        btn.disabled = false;
      }
    }

    cargarSaldo();
  </script>
</body>
</html>
