<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rueda de la Suerte — SUCE</title>
<link rel="stylesheet" href="../css/styles.css">
<style>
  .rueda-wrap { display: flex; justify-content: center; margin: 10px 0 22px; }
  .rueda {
    width: 200px; height: 200px;
    border-radius: 50%;
    background: conic-gradient(
      #2a2f3d 0deg 130deg,
      #3ecf6e 130deg 220deg,
      #d4af37 220deg 285deg,
      #a9791f 285deg 320deg,
      #e5484d 320deg 345deg,
      #f4d778 345deg 360deg
    );
    border: 4px solid var(--gold-soft);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
    transition: transform 3s cubic-bezier(.17,.89,.32,1.15);
  }
  .puntero {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 20px solid var(--gold-soft);
    z-index: 2;
  }
</style>
</head>
<body>
  <div class="contenedor">
    <a href="../index.html" class="volver">← Volver al lobby</a>
    <div class="topbar">
      <div class="marca">🎡 Rueda de la Suerte</div>
      <div class="saldo">🪙 <span id="saldo">···</span></div>
    </div>

    <div class="panel" style="text-align:center;">
      <div class="rueda-wrap" style="position:relative;">
        <div class="puntero"></div>
        <div class="rueda" id="rueda"></div>
      </div>

      <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px; justify-content:center;">
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(-10)">−</button>
        <div style="flex:1; text-align:center; font-weight:700; font-size:1.2rem; color:var(--gold-soft);">🪙 <span id="valor-apuesta">50</span></div>
        <button class="ficha-btn" style="width:44px;height:44px;border-radius:50%;flex-shrink:0;" onclick="cambiarApuesta(10)">+</button>
      </div>

      <button onclick="jugar()" id="btn-jugar">Girar la rueda</button>
      <div class="mensaje" id="mensaje"></div>
      <div class="sub">Multiplicadores posibles: x0, x1, x1.5, x2, x3, x10</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    Auth.requiereSesion("jugador");
    let apuesta = 50, girosAcumulados = 0;
    const MIN_APUESTA = 10, MAX_APUESTA = 1000;

    function cambiarApuesta(delta) {
      apuesta = Math.min(MAX_APUESTA, Math.max(MIN_APUESTA, apuesta + delta));
      document.getElementById("valor-apuesta").textContent = apuesta;
    }

    async function cargarSaldo() {
      document.getElementById("saldo").textContent = await obtenerMiSaldo();
    }

    async function jugar() {
      const btn = document.getElementById("btn-jugar");
      const mensaje = document.getElementById("mensaje");
      const rueda = document.getElementById("rueda");
      btn.disabled = true;
      mensaje.textContent = "";

      try {
        const data = await jugarRueda(apuesta);
        // Giro puramente decorativo: varias vueltas + un offset random,
        // el resultado real ya vino calculado del servidor.
        girosAcumulados += 1080 + Math.floor(Math.random() * 300);
        rueda.style.transform = `rotate(${girosAcumulados}deg)`;

        setTimeout(() => {
          if (data.ganancia > 0) {
            mensaje.textContent = `¡Salió x${data.resultado.multiplicador}! Ganaste ${data.ganancia} fichas 🎉`;
            mensaje.className = "mensaje ganaste";
          } else {
            mensaje.textContent = "Salió x0 — sin suerte esta vez";
            mensaje.className = "mensaje perdiste";
          }
          document.getElementById("saldo").textContent = data.saldo_nuevo;
          btn.disabled = false;
        }, 3000);
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
        btn.disabled = false;
      }
    }

    cargarSaldo();
  </script>
</body>
</html>
