<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUCE — Ingresar</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .portada {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .logo-grande {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
    text-shadow: 0 0 40px rgba(45,212,191,0.15);
  }
  .tagline {
    color: var(--text-dim);
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .form-login { width: 100%; max-width: 340px; }
  .aviso {
    margin-top: 24px;
    color: var(--text-dim);
    font-size: 0.78rem;
    max-width: 320px;
    line-height: 1.5;
  }
  .aviso b { color: var(--gold-soft); }
</style>
</head>
<body>
  <div class="contenedor portada">
    <div class="logo-grande" style="display:flex; align-items:center; justify-content:center; gap:10px;">
      <svg width="40" height="40" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="13" fill="url(#chipGrad)" stroke="#7a5a12" stroke-width="1"/>
        <circle cx="14" cy="14" r="9" fill="none" stroke="#1a1400" stroke-width="1.3" stroke-dasharray="2.5 2.8"/>
        <circle cx="14" cy="14" r="4.2" fill="#1a1400"/>
        <defs>
          <linearGradient id="chipGrad" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#5eead4"/>
            <stop offset="1" stop-color="#0f766e"/>
          </linearGradient>
        </defs>
      </svg>
      SUCE
    </div>
    <div class="tagline">Entretenimiento · Fichas virtuales</div>

    <div class="panel form-login">
      <input type="text" id="username" placeholder="Usuario" autocomplete="username">
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
      <button onclick="hacerLogin()">Ingresar</button>
      <div class="mensaje" id="mensaje"></div>
    </div>

    <p class="aviso">
      <b>Fichas 100% virtuales</b>, sin valor monetario real. No se compran
      ni se canjean por dinero — solo para divertirte.
    </p>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function hacerLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = "";

      if (!username || !password) {
        mensaje.textContent = "Completá usuario y contraseña";
        mensaje.className = "mensaje perdiste";
        return;
      }

      try {
        const data = await login(username, password);
        window.location.href = data.rol === "admin" ? "admin.html" : "index.html";
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      }
    }

    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") hacerLogin();
    });
  </script>
</body>
</html>
