<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SUCE — Ingresar</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .portada {
    min-height: 80vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .logo-grande {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--gold-soft), var(--gold) 55%, var(--gold-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 4px;
    text-shadow: 0 0 40px rgba(45,212,191,0.15);
  }
  .tagline {
    color: var(--text-dim);
    font-size: 0.85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 36px;
  }
  .form-login { width: 100%; max-width: 340px; }
  .aviso {
    margin-top: 24px;
    color: var(--text-dim);
    font-size: 0.78rem;
    max-width: 320px;
    line-height: 1.5;
  }
  .aviso b { color: var(--gold-soft); }
</style>
</head>
<body>
  <div class="contenedor portada">
    <div class="logo-grande" style="display:flex; align-items:center; justify-content:center; gap:10px;">
      <span class="logo-c g" role="img" aria-label="Logo SUCE"></span>
      SUCE
    </div>
    <div class="tagline" id="tagline">Entretenimiento · Fichas virtuales</div>

    <div class="panel form-login">
      <input type="text" id="username" placeholder="Usuario" autocomplete="username">
      <div class="campo-clave"><input type="password" id="password" placeholder="Contraseña" autocomplete="current-password"><button type="button" class="ojo" id="btn-ojo" aria-label="Mostrar contraseña" aria-pressed="false"><svg class="i-ver" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="i-ocultar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M4 4l16 16"/></svg></button></div>
      <button onclick="hacerLogin()">Ingresar</button>
      <div class="mensaje" id="mensaje"></div>
    </div>

 <p class="aviso">
  <b>Entretenimiento con fichas virtuales.</b> Sin dinero real. +18. Jugá con responsabilidad.
</p>

  <script src="js/api.js"></script>
  <script>
    // Entrar a esta pantalla siempre cierra la sesión anterior: hay que escribir usuario y contraseña de nuevo
    // Un solo login para todos: al entrar acá se cierra cualquier sesión de esta pestaña.
    Auth.olvidar("admin");
    Auth.olvidar("jugador");

    document.getElementById("btn-ojo").addEventListener("click", (e) => {
      const inp = document.getElementById("password"), b = e.currentTarget, ver = inp.type === "password";
      inp.type = ver ? "text" : "password";
      b.setAttribute("aria-pressed", String(ver)); b.setAttribute("aria-label", ver ? "Ocultar contraseña" : "Mostrar contraseña");
      b.querySelector(".i-ver").style.display = ver ? "none" : ""; b.querySelector(".i-ocultar").style.display = ver ? "" : "none";
      inp.focus();
    });

    async function hacerLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const mensaje = document.getElementById("mensaje");
      mensaje.textContent = "";

      if (!username || !password) {
        mensaje.textContent = "Completá usuario y contraseña";
        mensaje.className = "mensaje perdiste";
        return;
      }

      try {
        const data = await login(username, password);
        window.location.href = data.rol === "admin" ? "admin.html" : "index.html";
      } catch (e) {
        mensaje.textContent = e.message;
        mensaje.className = "mensaje perdiste";
      }
    }

    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") hacerLogin();
    });
  </script>
</body>
</html>
